# Render Blueprint for MSME Loan Origination System
# Deploy all 4 MCP services + Web Interface
# Usage: Connect this repo to Render and it will auto-deploy

services:
  # Francis MCP - Customer Interface (with /loan/submit endpoint)
  - type: web
    name: francis-mcp
    runtime: python
    plan: free
    rootDir: services/francis-mcp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_modular:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: DATA_SERVICES_URL
        value: "https://data-services-mcp.onrender.com"
      - key: NIKITA_MCP_URL
        value: "https://nikita-mcp.onrender.com"
      - key: KESHA_MCP_URL
        value: "https://kesha-mcp.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health

  # Data Services MCP - External API Gateway
  - type: web
    name: data-services-mcp
    runtime: python
    plan: free
    rootDir: services/data-services-mcp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health

  # Nikita MCP - CAM Assembly
  - type: web
    name: nikita-mcp
    runtime: python
    plan: free
    rootDir: services/nikita-mcp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATA_SERVICES_URL
        fromService:
          name: data-services-mcp
          type: web
          property: hostport
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health

  # Kesha MCP - Credit Assessment
  - type: web
    name: kesha-mcp
    runtime: python
    plan: free
    rootDir: services/kesha-mcp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATA_SERVICES_URL
        fromService:
          name: data-services-mcp
          type: web
          property: hostport
      - key: NIKITA_MCP_URL
        fromService:
          name: nikita-mcp
          type: web
          property: hostport
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /health
