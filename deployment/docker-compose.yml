version: '3.8'

services:
  # Data Services MCP - External API Gateway
  data-services-mcp:
    build:
      context: ../services/data-services-mcp
      dockerfile: ../../deployment/Dockerfile.data-services
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LOG_LEVEL=INFO
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nikita MCP - CAM Assembly Agent
  nikita-mcp:
    build:
      context: ../services/nikita-mcp
      dockerfile: ../../deployment/Dockerfile.nikita
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - LOG_LEVEL=INFO
      - DATA_SERVICES_URL=http://data-services-mcp:8001
    networks:
      - mcp-network
    depends_on:
      - data-services-mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Kesha MCP - Credit Intelligence Agent
  kesha-mcp:
    build:
      context: ../services/kesha-mcp
      dockerfile: ../../deployment/Dockerfile.kesha
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - LOG_LEVEL=INFO
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Francis MCP - Customer Conversation Agent
  francis-mcp:
    build:
      context: ../services/francis-mcp
      dockerfile: ../../deployment/Dockerfile.francis
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATA_SERVICES_URL=http://data-services-mcp:8001
      - NIKITA_MCP_URL=http://nikita-mcp:8002
      - KESHA_MCP_URL=http://kesha-mcp:8003
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    networks:
      - mcp-network
    depends_on:
      - data-services-mcp
      - nikita-mcp
      - kesha-mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge

volumes:
  logs:
